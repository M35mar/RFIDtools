# 4 GB build hosts: cap both JVMs and worker count so the native build, Kotlin
# compiler and dexer do not get OOM-killed in the same burst.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx768m

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 new DSL is not yet compatible with the JetBrains Kotlin Android plugin
# used by this project (Kotlin 2.4 still requires the legacy DSL bridge).
android.newDsl=false
android.builtInKotlin=false

kotlin.code.style=official
