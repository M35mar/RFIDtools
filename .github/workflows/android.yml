name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with PM3 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug build
        run: ./gradlew :core:pm3:testDebugUnitTest :core:pm3:lintDebug :core:pm3:assembleDebug --stacktrace

      - name: Check release tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' core/pm3/build.gradle.kts | head -n1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${TAG}" != "${VERSION_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}." >&2
            exit 1
          fi

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          fi
          KEYSTORE="${RUNNER_TEMP}/release.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
          cat > keystore.properties <<EOF
          storeFile=${KEYSTORE}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :core:pm3:assembleRelease --stacktrace

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: rfidtools-debug-apk
          path: core/pm3/build/outputs/apk/debug/pm3-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: rfidtools-release-apk
          path: core/pm3/build/outputs/apk/release/pm3-release.apk
          if-no-files-found: error

      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          APK="core/pm3/build/outputs/apk/release/pm3-release.apk"
          NOTES="$(mktemp)"

          # Release body: only the "### Highlights" bullets of the matching
          # CHANGELOG section, so the release stays short. The full history
          # stays in CHANGELOG.md, linked below.
          HIGHLIGHTS="$(awk -v ver="## ${VERSION}" '
            substr($0, 1, length(ver)) == ver { in_section = 1; next }
            in_section && /^## / { exit }
            in_section && /^### Highlights[[:space:]]*$/ { in_highlights = 1; next }
            in_highlights && /^### / { exit }
            in_highlights { print }
          ' CHANGELOG.md)"

          # Older tags have no Highlights subsection: fall back to the section
          # bullets instead of publishing an empty body.
          if [ -z "${HIGHLIGHTS}" ]; then
            HIGHLIGHTS="$(awk -v ver="## ${VERSION}" '
              substr($0, 1, length(ver)) == ver { in_section = 1; next }
              in_section && /^## / { exit }
              in_section && /^- / { print }
            ' CHANGELOG.md)"
          fi

          {
            printf '## Novità in %s\n\n' "${VERSION}"
            printf '%s\n\n' "${HIGHLIGHTS}"
            printf '[Changelog completo](https://github.com/%s/blob/main/CHANGELOG.md) · [Download APK](https://github.com/%s/releases/download/%s/pm3-release.apk)\n' \
              "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}" "${TAG}"
            printf 'Firmato · si installa sopra le versioni precedenti.\n'
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "RFIDtools ${TAG}" \
              --notes-file "$NOTES" \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" \
              --title "RFIDtools ${TAG}" \
              --notes-file "$NOTES" \
              --latest
          fi
          gh release upload "$TAG" "$APK" --clobber
