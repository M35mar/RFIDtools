name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with PM3 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:pm3:testDebugUnitTest :core:pm3:lintDebug :core:pm3:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pm3-debug-apk
          path: core/pm3/build/outputs/apk/debug/pm3-debug.apk
          if-no-files-found: error

      - name: Publish debug APK release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="core/pm3/build/outputs/apk/debug/pm3-debug.apk"
          NOTES="$(mktemp)"
          printf '%s\n' \
            "Official PM3 Android ${TAG} release." \
            '' \
            'The attached APK is **debug-signed** for testing and sideloading.' \
            '' \
            "- Version: \`${TAG}\`" \
            '- Package: `com.farmacia.pm3android.debug`' \
            "- Version name: \`${TAG}-debug\`" \
            '- ABI: `arm64-v8a`' \
            '- Minimum Android: 8.0 (API 26)' \
            '- Scripts: Lua, Cmd, Python (experimental)' \
            '' \
            'This build uses the Android debug keystore. It is **not** a production-signed release.' \
            'See the README for installation, hardware compatibility, build and troubleshooting notes.' \
            > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "PM3 Android ${TAG}" \
              --notes-file "$NOTES" \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" \
              --title "PM3 Android ${TAG}" \
              --notes-file "$NOTES" \
              --latest
          fi
          gh release upload "$TAG" "$APK" --clobber
